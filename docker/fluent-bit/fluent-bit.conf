[SERVICE]
    Flush                     1
    Daemon                    Off
    Log_Level                 info
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_PORT                 2020
    storage.path              /var/log/fluent-bit/storage
    storage.sync              normal
    storage.checksum          on
    storage.backlog.mem_limit 128M

# Container stdout/stderr. The built-in docker multiline parser unwraps the
# Docker envelope and joins stack-trace continuations before HTTP delivery.
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Tag               raw.container.*
    Multiline.Parser  docker
    DB                /var/log/fluent-bit/container-tail.db
    DB.Sync           normal
    Mem_Buf_Limit     64MB
    Buffer_Chunk_Size 64KB
    Buffer_Max_Size   1MB
    Skip_Long_Lines   off
    Refresh_Interval  2
    Read_from_Head    true
    Path_Key          source_path
    Offset_Key        source_offset
    storage.type      filesystem

# Direct application/file logs. No format is imposed; JSON and plain text are
# both delivered unchanged in the "log" field to the universal adapter.
[INPUT]
    Name              tail
    Path              /var/log/observalog/*.log
    Tag               raw.file.*
    DB                /var/log/fluent-bit/file-tail.db
    DB.Sync           normal
    Mem_Buf_Limit     64MB
    Buffer_Chunk_Size 64KB
    Buffer_Max_Size   1MB
    Skip_Long_Lines   off
    Refresh_Interval  2
    Read_from_Head    true
    Path_Key          source_path
    Offset_Key        source_offset
    storage.type      filesystem

[OUTPUT]
    Name          http
    Match         raw.*
    Host          brain
    Port          4000
    URI           /ingest/raw
    Format        json_lines
    Json_Date_Key fluentbit_time
    Json_Date_Format iso8601
    Header        X-ObservaLog-Source fluent-bit
    Header        X-ObservaLog-Token ${LITE_INGEST_TOKEN}
    Retry_Limit   False
