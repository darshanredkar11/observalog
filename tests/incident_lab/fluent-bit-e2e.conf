[SERVICE]
    Flush                     1
    Daemon                    Off
    Log_Level                 info
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_PORT                 2020
    storage.path              /var/log/fluent-bit/storage
    storage.sync              normal
    storage.checksum          on
    storage.backlog.mem_limit 128M

[INPUT]
    Name              tail
    Path              /var/log/observalog/*.log
    Tag               test.raw.*
    DB                /var/log/fluent-bit/e2e-tail.db
    DB.Sync           normal
    Mem_Buf_Limit     32MB
    Buffer_Chunk_Size 16KB
    Buffer_Max_Size   1MB
    Skip_Long_Lines   off
    Refresh_Interval  1
    Read_from_Head    true
    Path_Key          source_path
    Offset_Key        source_offset
    storage.type      filesystem

[OUTPUT]
    Name          http
    Match         test.raw.*
    Host          brain
    Port          4000
    URI           /ingest/raw
    Format        json_lines
    Json_Date_Key fluentbit_time
    Json_Date_Format iso8601
    Header        X-ObservaLog-Source fluent-bit-e2e
    Header        X-ObservaLog-Token ${LITE_INGEST_TOKEN}
    Retry_Limit   False
