services:
  timescaledb:
    image: timescale/timescaledb:2.31.2-pg16
    environment:
      POSTGRES_USER: observalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observalog}
      POSTGRES_DB: observalog
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observalog -d observalog"]
      interval: 5s
      timeout: 5s
      retries: 15

  brain:
    build:
      context: ./observalog-brain
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://observalog:${POSTGRES_PASSWORD:-observalog}@timescaledb:5432/observalog
      LISTEN_ADDR: 0.0.0.0:4000
      DB_MAX_CONNECTIONS: 20
      LITE_MAX_INFLIGHT_GATE_WORK: 50000
      LITE_SLOW_THRESHOLD_MS: 1000
      RUST_LOG: info
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.2
    volumes:
      - ${FLUENT_BIT_CONFIG:-./docker/fluent-bit/fluent-bit.conf}:/fluent-bit/etc/fluent-bit.conf:ro
      - ./docker/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./var/logs:/var/log/observalog:ro
      - fluent_bit_state:/var/log/fluent-bit
    depends_on:
      brain:
        condition: service_healthy
    ports:
      - "2020:2020"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2020/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  timescaledb_data:
  fluent_bit_state:
