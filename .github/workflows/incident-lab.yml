name: Incident Lab Generator

on:
  push:
    paths:
      - "tests/incident_lab/**"
      - ".github/workflows/incident-lab.yml"
  pull_request:
    paths:
      - "tests/incident_lab/**"
      - ".github/workflows/incident-lab.yml"

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile generator
        run: python -m py_compile tests/incident_lab/generate.py
      - name: Compile mega corpus generator
        run: python -m py_compile tests/incident_lab/mega_corpus.py
      - name: Generate mega corpus smoke set
        run: python tests/incident_lab/mega_corpus.py --count 620 --seed 20261126 --duplicate-rate 0.04 --output /tmp/mega-corpus-smoke
      - name: Validate mega corpus integrity and truth isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/mega-corpus-smoke")
          raw = (root / "raw" / "corpus.jsonl").read_text().splitlines()
          truth = json.loads((root / "ground-truth" / "labels.json").read_text())
          records = [json.loads(line) for line in raw]
          assert len(records) == 644, f"expected 644 records including duplicates, got {len(records)}"
          assert len(truth["labels"]) == 620
          assert len(truth["functional_classes"]) == 31
          assert truth["duplicates"] == 24
          assert set(r["scenario"] for r in records) == set(truth["functional_classes"])
          assert all("expected_class" not in r and "primary_cause" not in r for r in records), "truth leaked into raw records"
          assert sum(1 for r in records if r.get("collector_duplicate")) == 24
          print("mega corpus verified: 620 base + 24 duplicates; 31 classes; evaluator truth isolated")
          PY
      - name: Generate full 25k corpus bundle
        run: python tests/incident_lab/mega_corpus.py --count 25000 --seed 20261126 --duplicate-rate 0.04 --output /tmp/observalog-full-corpus
      - name: Upload raw corpus (safe for ingestion)
        uses: actions/upload-artifact@v4
        with:
          name: observalog-lite-raw-corpus-25k
          path: /tmp/observalog-full-corpus/raw/corpus.jsonl
          retention-days: 14
      - name: Upload evaluator truth (never ingest)
        uses: actions/upload-artifact@v4
        with:
          name: observalog-lite-ground-truth-25k
          path: /tmp/observalog-full-corpus/ground-truth/labels.json
          retention-days: 14
      - name: Upload corpus metadata
        uses: actions/upload-artifact@v4
        with:
          name: observalog-lite-corpus-metadata
          path: /tmp/observalog-full-corpus/README.txt
          retention-days: 14
      - name: Generate randomized incident streams
        run: |
          python tests/incident_lab/generate.py \
            --all --permutations 3 --seed 20261125 --shuffle-arrival \
            --duplicate-rate 0.05 --drop-optional-rate 0.10 \
            --output /tmp/incident-output
      - name: Verify corpus and truth isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/incident-output")
          raw = sorted((root / "raw").glob("*.log"))
          truth = sorted((root / "ground-truth").glob("*.json"))
          manifest = json.loads((root / "manifest.json").read_text())
          assert len(raw) == 66, f"expected 63 raw streams, got {len(raw)}"
          assert len(truth) == 66, f"expected 63 truth files, got {len(truth)}"
          assert len(manifest) == 66
          assert all("primary_cause" not in p.read_text() for p in raw), "ground truth leaked into raw logs"
          poison = [p for p in manifest if p["scenario"] == "poison-record-isolation"]
          assert len(poison) == 3 and all(p["malformed_records"] == 1 for p in poison)
          print("verified 22 scenarios × 3 arrival permutations; truth remains outside raw/")
          PY

# Generator validation runs only on the incident corpus paths.

