name: Deploy ObservaLog Lite site

on:
  push:
    branches: [lite/chaos-gate-3-5]
    paths:
      - 'docs/lite/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lite-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Lite website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Lite site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/lite/site/
      - name: Deploy Lite site
        id: deploy
        uses: actions/deploy-pages@v4
