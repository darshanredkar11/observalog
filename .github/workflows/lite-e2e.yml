name: ObservaLog Lite Native Validation

concurrency:
  group: observalog-lite-native-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [lite/streaming-adapter, lite/adversarial-gate-testing, lite/chaos-gate-3-5]
    paths:
      - "observalog-brain/**"
      - "tests/incident_lab/**"
      - ".github/workflows/lite-e2e.yml"
  pull_request:
    paths:
      - "observalog-brain/**"
      - "tests/incident_lab/**"
      - ".github/workflows/lite-e2e.yml"

jobs:
  native-tests:
    name: Native Rust tests (no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            observalog-brain/target
          key: ${{ runner.os }}-lite-native-${{ hashFiles('observalog-brain/Cargo.lock') }}
      - name: Validate incident fixture generator
        run: python -m py_compile tests/incident_lab/generate.py
      - name: Run Rust unit and adversarial tests
        working-directory: observalog-brain
        run: cargo test -- --nocapture
      - name: Clippy
        working-directory: observalog-brain
        run: cargo clippy -- -D warnings
