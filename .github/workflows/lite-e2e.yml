name: ObservaLog Lite End-to-End

concurrency:
  group: observalog-lite-e2e-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [lite/streaming-adapter]
    paths:
      - "docker-compose.yml"
      - "docker/fluent-bit/**"
      - "observalog-brain/**"
      - "tests/incident_lab/**"
      - ".github/workflows/lite-e2e.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker/fluent-bit/**"
      - "observalog-brain/**"
      - "tests/incident_lab/**"
      - ".github/workflows/lite-e2e.yml"

jobs:
  fluent-bit-to-timescale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LITE_INGEST_TOKEN: e2e-only-token-for-local-container-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generator
        run: python -m py_compile tests/incident_lab/generate.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Run real Fluent Bit → Brain → TimescaleDB pipeline
        run: bash tests/incident_lab/run_e2e.sh
