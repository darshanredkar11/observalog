name: Gate 5.2-B Corpus Evaluation
on:
  push:
    branches: [lite/chaos-gate-3-5]
    paths:
      - tests/incident_lab/gate52b_evaluate.py
      - tests/incident_lab/generate.py
      - .github/workflows/gate52b-evaluate.yml
  pull_request:
    branches: [lite/chaos-gate-3-5]
    paths:
      - tests/incident_lab/gate52b_evaluate.py
      - tests/incident_lab/generate.py
      - .github/workflows/gate52b-evaluate.yml
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile evaluator and generator
        run: python -m py_compile tests/incident_lab/gate52b_evaluate.py tests/incident_lab/generate.py
      - name: Evaluate all scenarios with arrival permutations
        run: python tests/incident_lab/gate52b_evaluate.py --permutations 3 --duplicate-rate 0.10 --drop-optional-rate 0.15 --output gate52b-evaluation.json
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: gate52b-evaluation
          path: gate52b-evaluation.json
