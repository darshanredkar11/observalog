name: Gate 1 - Normalize Adversarial Tests

on:
  workflow_dispatch:
  push:
    branches: [lite/adversarial-gate-testing]
    paths:
      - 'observalog-brain/src/lite/adapter.rs'
      - 'observalog-brain/src/lite/model.rs'
      - '.github/workflows/lite-adversarial.yml'

jobs:
  normalize-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Run Gate 1 adversarial unit corpus
        working-directory: observalog-brain
        run: cargo test gate1_adversarial_tests -- --nocapture
      - name: Run all adapter regression tests
        working-directory: observalog-brain
        run: cargo test adapter::
