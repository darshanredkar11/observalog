name: Gate 2 Quality Adversarial

on:
  workflow_dispatch:
  push:
    branches:
      - lite/adversarial-gate-testing
    paths:
      - observalog-brain/src/lite/gates.rs
      - observalog-brain/src/lite/model.rs
      - .github/workflows/gate2-quality.yml

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native Rust prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Quality gate adversarial tests
        working-directory: observalog-brain
        run: cargo test gate2_quality_tests -- --nocapture
