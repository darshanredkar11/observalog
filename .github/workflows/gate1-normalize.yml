name: Gate 1 Normalize Adversarial

"on":
  workflow_dispatch:
  push:
    branches:
      - lite/adversarial-gate-testing
    paths:
      - observalog-brain/src/lite/adapter.rs
      - observalog-brain/src/lite/model.rs
      - .github/workflows/gate1-normalize.yml

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Native Rust prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Normalize gate adversarial tests
        working-directory: observalog-brain
        run: cargo test gate1_adversarial_tests -- --nocapture
      - name: Existing adapter regression tests
        working-directory: observalog-brain
        run: cargo test adapter
