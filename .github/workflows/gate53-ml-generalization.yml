name: Gate 5.3 ML Generalization Experiment
on:
  push:
    branches: [research/gate53-ml-generalization]
    paths:
      - tests/incident_lab/gate53_ml_generalization.py
      - tests/incident_lab/mega_corpus.py
      - tests/incident_lab/mega_corpus_leakage_audit.py
      - .github/workflows/gate53-ml-generalization.yml
  pull_request:
    branches: [research/gate53-ml-generalization]
    paths:
      - tests/incident_lab/gate53_ml_generalization.py
      - tests/incident_lab/mega_corpus.py
      - tests/incident_lab/mega_corpus_leakage_audit.py
      - .github/workflows/gate53-ml-generalization.yml
  workflow_dispatch:
jobs:
  ml-generalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip scikit-learn
      - name: Audit generated corpus
        run: python3 tests/incident_lab/mega_corpus_leakage_audit.py --count 6200 --seed 20261128 --output /tmp/gate53/leakage.json
      - name: Generate seeded corpus
        run: python3 tests/incident_lab/mega_corpus.py --count 25000 --seed 20261128 --duplicate-rate 0.04 --output /tmp/gate53/corpus
      - name: Run ML models on scenario-held-out split
        run: |
          python3 tests/incident_lab/gate53_ml_generalization.py \
            --raw /tmp/gate53/corpus/raw/corpus.jsonl \
            --labels /tmp/gate53/corpus/ground-truth/labels.json \
            --output /tmp/gate53/report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: gate53-ml-generalization-report
          path: /tmp/gate53/report.json
          if-no-files-found: error
